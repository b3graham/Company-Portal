# fail2ban filter: bad or missing bearer tokens on the portal's read-only CRM API.
#
# Matches Caddy JSON access-log lines for /api/crm/* that returned 401.
# Caddy's default JSON log puts an epoch float in "ts"; {EPOCH} is fail2ban's
# placeholder for that. See Caddyfile.example.
#
# Test against a live log:
#   fail2ban-regex /var/log/caddy/portal-access.log /etc/fail2ban/filter.d/portal-api.conf

[INCLUDES]
before = common.conf

[Definition]
datepattern = "ts":{EPOCH}

failregex = ^.*"client_ip":"<HOST>"[^}]*"uri":"/api/crm[^"]*".*"status":401\b

ignoreregex =
