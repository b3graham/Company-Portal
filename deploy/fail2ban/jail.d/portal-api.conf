# fail2ban jail: lock out clients that keep presenting a bad token to /api/crm.
#
# Install:
#   cp deploy/fail2ban/filter.d/portal-api.conf /etc/fail2ban/filter.d/
#   cp deploy/fail2ban/jail.d/portal-api.conf   /etc/fail2ban/jail.d/
#   systemctl reload fail2ban && fail2ban-client status portal-api
#
# If Caddy runs in Docker rather than on the host, the ban must land in the
# DOCKER-USER chain or it is bypassed:  action = iptables-allports[chain=DOCKER-USER]
# and point logpath at the container's mounted log file.

[portal-api]
enabled  = true
filter   = portal-api
logpath  = /var/log/caddy/portal-access.log
backend  = polling
port     = http,https
maxretry = 5
findtime = 10m
bantime  = 1h
# The Paperclip host and the bastion must never be locked out by a mis-set token.
# Add their IPs here (space separated) once Phase 0 assigns them.
ignoreip = 127.0.0.1/8 ::1
